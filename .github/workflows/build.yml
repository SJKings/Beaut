name: Android production build

# Builds a Google Play .aab on Expo's servers (EAS Build).
# Runs on every push to main that changes the app, or by hand from the
# Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: eas-android-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_USERNAME: ${{ secrets.EXPO_USERNAME }}
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EXPO_USERNAME" ]; then
            echo "::error::Add EXPO_TOKEN and EXPO_USERNAME under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Link to the Expo project owned by EXPO_USERNAME, creating it on the first run.
      - name: Link Expo project
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.owner = process.env.EXPO_USERNAME;
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          '
          eas init --non-interactive --force

      # credentialsSource "remote" (eas.json): Expo generates the Android upload
      # keystore on the first build and stores it on its servers for every later build.
      # --no-wait hands the build to Expo and finishes this job; the .aab appears at
      # expo.dev under the project's Builds when it's done (about 10-20 minutes).
      - name: Start EAS Android production build
        run: eas build --platform android --profile production --non-interactive --no-wait
