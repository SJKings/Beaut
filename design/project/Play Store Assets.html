<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Beaut – Play Store assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E1DE;font-family:'Outfit',sans-serif;color:#1E1A1B}
a{color:#D64C7F}a:hover{color:#B23763}
</style>
</head>
<body>
<div id="root" style="padding:60px;display:flex;flex-direction:column;gap:80px"></div>
<script>
const C={pink:'#D64C7F',pinkL:'#F08DB2',ink:'#1E1A1B',bg:'#FBF8F8',line:'#EFE5E8',mute:'#7A6F72',soft:'#FBE7EF',grey:'#CFC3C7'};
const MONO="font-family:'JetBrains Mono',monospace";
const stripe=(a='#F1DCE3',b='#F7E9EE',s=7)=>`repeating-linear-gradient(135deg,${a} 0 ${s}px,${b} ${s}px ${s*2}px)`;
const ICONS={
haircut:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',
facial:'<path d="M12 3c-4 0-7 3.2-7 8 0 5 3.2 10 7 10s7-5 7-10c0-4.8-3-8-7-8z"/><path d="M9 11h.01M15 11h.01"/><path d="M9.5 15.2c1.4 1 3.6 1 5 0"/><path d="M19.5 2.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/>',
sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>'
};
const ico=(k,size,color,sw=1.3)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const ph=(k,h,r,dark)=>`<div style="height:${h}px;border-radius:${r}px;background:${dark?'#2E2729':C.soft};display:flex;align-items:center;justify-content:center">${ico(k,Math.round(h*.6),C.pink)}</div>`;
const chev=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${C.ink}" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;
const backBtn=`<div style="width:44px;height:44px;border-radius:50%;border:1px solid ${C.line};background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></div>`;
const status=(fg)=>`<div style="position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:15px;font-weight:600;color:${fg};z-index:5"><span>9:41</span><div style="width:17px;height:10px;border-radius:2px;border:1.5px solid currentColor"></div></div>`;
const nav=(active)=>{const items=[['Home','⌂'],['Explore','⌕'],['Code','#'],['Bookings','≡']];return `<div style="position:absolute;left:20px;right:20px;bottom:26px;height:68px;border-radius:999px;background:${C.ink};display:flex;align-items:center;justify-content:space-between;padding:0 8px">${items.map(([l,g])=>{const a=l===active;return `<div style="height:52px;border-radius:999px;background:${a?'#fff':'transparent'};display:flex;align-items:center;gap:8px;padding:0 ${a?18:6}px 0 6px"><span style="width:40px;height:40px;border-radius:50%;background:${a?C.pink:'#2E2729'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;${MONO}">${g}</span>${a?`<span style="font-size:14px;font-weight:600;color:${C.pink}">${l}</span>`:''}</div>`}).join('')}</div>`};
const row=(k,v)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F4EEF0;font-size:14px"><span style="color:${C.mute}">${k}</span><span style="font-weight:500">${v}</span></div>`;
const btn=(l,bg=C.pink,fg='#fff',border='none')=>`<div style="height:56px;border-radius:999px;background:${bg};color:${fg};border:${border};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">${l}</div>`;
const scr=(inner,bg=C.bg)=>`<div style="position:relative;width:390px;height:844px;overflow:hidden;background:${bg};flex-shrink:0">${inner}</div>`;

const S={
welcome:()=>scr(`${status('#fff')}
<div style="position:absolute;top:0;left:0;right:0;height:64%;background:#2A2427;display:flex;align-items:center;justify-content:center;padding-bottom:60px;box-sizing:border-box">${ico('sparkle',220,C.pinkL,1)}</div>
<div style="position:absolute;top:40%;left:0;right:0;height:24%;background:linear-gradient(180deg,rgba(30,26,27,0),#1E1A1B)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:0 28px 44px;display:flex;flex-direction:column;gap:18px">
<div style="font-size:18px;font-weight:700;color:${C.pinkL}">Beaut.</div>
<div style="font-size:42px;line-height:1.05;font-weight:600;color:#fff;letter-spacing:-0.03em">Beauty care, booked in a minute.</div>
<div style="font-size:15px;line-height:1.5;color:${C.grey}">No sign-up, no passwords. Pick a service, choose a time and keep your booking code.</div>
<div style="margin-top:10px;display:flex;align-items:center;gap:14px;padding:7px 22px 7px 7px;border-radius:999px;border:1px solid #3A3235;background:#2A2427;color:#fff"><span style="width:50px;height:50px;border-radius:50%;background:${C.pink};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span style="font-size:16px;font-weight:500;flex:1">Get started</span><span style="color:#8A7A80;letter-spacing:2px">›››</span></div>
<div style="text-align:center;color:${C.pinkL};font-size:15px;font-weight:500">I have a booking code</div></div>`,C.ink),
home:()=>scr(`${status(C.ink)}<div style="padding:64px 20px 0;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;justify-content:space-between"><div><div style="font-size:14px;color:${C.mute}">Good morning</div><div style="font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-0.02em">Discover &amp; book<br>beauty care</div></div><div style="width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid ${C.line}"></div></div>
<div style="height:50px;border-radius:999px;background:#fff;border:1px solid ${C.line};display:flex;align-items:center;padding:0 18px;font-size:15px;color:#A99DA0">⌕&nbsp;&nbsp;Search services</div>
<div style="position:relative;border-radius:26px;background:${C.pink};height:160px;overflow:hidden"><div style="padding:22px;width:58%;display:flex;flex-direction:column;gap:6px;height:100%;box-sizing:border-box"><div style="font-size:30px;font-weight:700;color:#fff;line-height:1">20% off</div><div style="font-size:14px;color:#FFE9F1">Your first visit at any Beaut studio</div><div style="margin-top:auto;align-self:flex-start;background:${C.ink};color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600">Book now</div></div><div style="position:absolute;right:0;top:0;bottom:0;width:44%;display:flex;align-items:center;justify-content:center">${ico('sparkle',110,'#fff',1.2)}</div></div>
<div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:#fff;border:1px solid ${C.line}"><div style="width:44px;height:44px;border-radius:14px;background:${C.ink};color:${C.pinkL};display:flex;align-items:center;justify-content:center;${MONO};font-weight:600">#</div><div style="flex:1"><div style="font-size:15px;font-weight:600">Already booked?</div><div style="font-size:13px;color:${C.mute}">Enter your code to view or change it</div></div>${chev}</div>
<div style="display:flex;gap:8px">${['Hair','Nails','Makeup','Facial'].map(c=>`<div style="border:1px solid ${C.line};background:#fff;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:500">${c}</div>`).join('')}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${[['Signature Cut &amp; Style','$45','60 min','haircut'],['Hydrating Facial','$50','60 min','facial']].map(([n,p,d,i])=>`<div style="background:#fff;border:1px solid ${C.line};border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:10px">${ph(i,110,16)}<div style="padding:0 6px 6px"><div style="font-size:14px;font-weight:600">${n}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><div><div style="font-size:16px;font-weight:700">${p}</div><div style="font-size:12px;color:${C.mute}">${d}</div></div><span style="width:32px;height:32px;border-radius:50%;background:${C.pink};color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px">+</span></div></div></div>`).join('')}</div>
</div>${nav('Home')}`),
service:()=>scr(`${status('#fff')}<div style="height:280px;background:#2A2427;display:flex;align-items:center;justify-content:center;padding-bottom:30px;box-sizing:border-box">${ico('facial',150,C.pinkL,1)}</div>
<div style="position:absolute;top:56px;left:20px">${backBtn}</div>
<div style="position:absolute;top:250px;left:0;right:0;bottom:0;background:${C.bg};border-radius:30px 30px 0 0;padding:22px 20px;display:flex;flex-direction:column;gap:16px">
<div><div style="font-size:24px;font-weight:600;letter-spacing:-0.02em">Hydrating Facial</div><div style="font-size:14px;margin-top:4px">★ 4.9 (168) &nbsp;<span style="color:${C.pink};font-weight:500">Beaut Studio, Lekki</span></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#F3EEEF;border-radius:999px;padding:5px">${['Booking','About','Reviews'].map((t,i)=>`<div style="border-radius:999px;padding:10px 0;text-align:center;font-size:14px;font-weight:600;background:${i?'transparent':C.pink};color:${i?'#5B5053':'#fff'}">${t}</div>`).join('')}</div>
<div style="display:flex;gap:8px">${['Any available','Lena K.','Amara O.'].map((s,i)=>`<div style="border:1px solid ${i===1?C.pink:C.line};background:${i===1?C.pink:'#fff'};color:${i===1?'#fff':C.ink};border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;white-space:nowrap">${s}</div>`).join('')}</div>
<div style="font-size:16px;font-weight:600">October 2026</div>
<div style="display:flex;gap:8px">${[['Mon',19],['Tue',20],['Wed',21],['Thu',22],['Fri',23],['Sat',24]].map(([d,n])=>{const a=n===21;return `<div style="width:48px;height:70px;border-radius:999px;border:1px solid ${a?C.pink:C.line};background:${a?C.pink:'#fff'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px"><span style="font-size:12px;color:${a?'#FFE1EC':C.mute}">${d}</span><span style="font-size:17px;font-weight:600;color:${a?'#fff':C.ink}">${n}</span></div>`}).join('')}</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${['09:00','10:00','11:00','12:00','13:30','14:30'].map(t=>{const a=t==='11:00',o=t==='12:00';return `<div style="border:1px solid ${a?C.pink:o?'#F3EEEF':C.line};background:${a?C.pink:o?'#F3EEEF':'#fff'};color:${a?'#fff':o?'#B9AEB1':C.ink};text-decoration:${o?'line-through':'none'};border-radius:999px;padding:11px 0;text-align:center;font-size:14px;font-weight:500">${t}</div>`}).join('')}</div>
<div style="margin-top:auto">${btn('Continue')}</div></div>`),
confirmed:()=>scr(`${status(C.ink)}<div style="padding:90px 24px 36px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;height:100%;box-sizing:border-box">
<div style="width:76px;height:76px;border-radius:50%;background:${C.pink};display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<div style="font-size:28px;font-weight:600;letter-spacing:-0.02em">You're booked</div>
<div style="font-size:15px;line-height:1.5;color:#6E6265;max-width:290px">Keep this code. It's how you'll find, change or cancel your booking.</div>
<div style="width:100%;box-sizing:border-box;padding:22px 16px;border-radius:24px;border:1.5px dashed #E3A6BD;background:#FFF5F8;display:flex;flex-direction:column;gap:6px;align-items:center"><span style="font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#B23763">Booking code</span><span style="${MONO};font-size:36px;font-weight:600;letter-spacing:.08em">BT-4F7Q2</span><span style="font-size:15px;font-weight:600">Amanda Okafor</span><span style="font-size:13px;color:#6E6265">+234 801 234 5678</span><span style="margin-top:6px;background:${C.ink};color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600">Copy code</span></div>
<div style="width:100%;box-sizing:border-box;padding:16px;border-radius:20px;background:#fff;border:1px solid ${C.line};text-align:left"><div style="font-size:15px;font-weight:600">Hydrating Facial</div><div style="font-size:13px;color:${C.mute}">Wed, 21 Oct · 11:00 · Lena K.</div></div>
<div style="width:100%;margin-top:auto;display:flex;flex-direction:column;gap:10px">${btn('View booking')}${btn('Back to home','transparent',C.ink,'1px solid #E6DADE')}</div></div>`),
find:()=>scr(`${status(C.ink)}<div style="padding:64px 20px 0;display:flex;flex-direction:column;gap:18px">
<div style="font-size:28px;font-weight:600;letter-spacing:-0.02em">Find your booking</div>
<div style="font-size:15px;color:#6E6265">Enter the code you received when you booked.</div>
<div style="height:68px;border-radius:20px;border:1.5px solid ${C.pink};background:#fff;display:flex;align-items:center;justify-content:center;${MONO};font-size:26px;font-weight:600;letter-spacing:.1em">BT-4F7Q2</div>
${btn('Find booking')}
<div style="font-size:16px;font-weight:600;margin-top:8px">Used on this device</div>
${[['BT-4F7Q2','Hydrating Facial'],['BT-P6GJ8','Soft Glam Makeup']].map(([c,s])=>`<div style="display:flex;justify-content:space-between;padding:14px 16px;border-radius:18px;background:#fff;border:1px solid ${C.line}"><span style="${MONO};font-size:14px;font-weight:600;color:${C.pink}">${c}</span><span style="font-size:13px;color:${C.mute}">${s}</span></div>`).join('')}
</div>${nav('Code')}`),
booking:()=>scr(`${status(C.ink)}<div style="padding:58px 20px 0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:14px">${backBtn}<div style="font-size:20px;font-weight:600;flex:1">Your booking</div><span style="border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;background:${C.soft};color:#B23763">Confirmed</span></div>
<div style="padding:18px;border-radius:24px;background:${C.ink};color:#fff;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:${C.grey}">Booking code</span><span style="${MONO};font-size:26px;font-weight:600;letter-spacing:.08em;color:${C.pinkL}">BT-4F7Q2</span><span style="font-size:15px;font-weight:600;margin-top:6px">Amanda Okafor</span><span style="font-size:13px;color:${C.grey}">+234 801 234 5678</span></div>
<div style="border-radius:22px;background:#fff;border:1px solid ${C.line};padding:4px 16px">${row('Service','Hydrating Facial')}${row('Date','Wed, 21 Oct')}${row('Time','11:00 – 12:00')}${row('Specialist','Lena K.')}${row('Payment','Pay at the studio')}</div>
${btn('Reschedule')}${btn('Cancel booking','transparent','#C0334F','1px solid #E6DADE')}
</div>`)
};

const phone=(s,scale)=>`<div style="width:${412*scale}px;height:${866*scale}px;flex-shrink:0"><div style="width:412px;height:866px;transform:scale(${scale});transform-origin:0 0;border-radius:58px;background:#151213;padding:11px;box-sizing:border-box"><div style="border-radius:47px;overflow:hidden">${s}</div></div></div>`;
const tablet=(panes,scale)=>{const w=390*panes.length+(panes.length-1)+48,h=844+48;return `<div style="width:${w*scale}px;height:${h*scale}px;flex-shrink:0"><div style="width:${w}px;height:${h}px;transform:scale(${scale});transform-origin:0 0;border-radius:40px;background:#151213;padding:24px;box-sizing:border-box"><div style="display:flex;gap:1px;background:${C.line};border-radius:18px;overflow:hidden">${panes.join('')}</div></div></div>`};

const board=(id,label,w,h,inner,bg)=>`<div style="display:flex;flex-direction:column;gap:12px"><div style="font-size:15px;font-weight:600">${label} <span style="font-weight:400;color:${C.mute}">· ${w}×${h}</span></div><div id="${id}" style="width:${w}px;height:${h}px;background:${bg};position:relative;overflow:hidden;flex-shrink:0">${inner}</div></div>`;
const group=(title,note,items)=>`<section style="display:flex;flex-direction:column;gap:24px"><div><h2 style="margin:0;font-size:32px;font-weight:600;letter-spacing:-0.02em">${title}</h2><div style="font-size:16px;color:${C.mute};margin-top:4px">${note}</div></div><div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">${items.join('')}</div></section>`;

const wordmark=(size,fg,dot=C.pink)=>`<span style="font-size:${size}px;font-weight:700;letter-spacing:-0.035em;color:${fg};line-height:1">Beaut<span style="color:${dot}">.</span></span>`;
const icon=(size,radius=0)=>`<div style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${C.pink};display:flex;align-items:center;justify-content:center;position:relative"><span style="font-size:${size*.62}px;font-weight:700;color:#fff;letter-spacing:-0.04em;line-height:1;margin-top:-${size*.04}px">B<span style="color:${C.ink}">.</span></span></div>`;

const phoneShot=(id,n,head,sub,s,dark)=>{const bg=dark?C.ink:n%2?C.soft:C.bg;const fg=dark?'#fff':C.ink;return board(id,`Phone ${n}`,1080,1920,`<div style="position:absolute;top:130px;left:90px;right:90px;display:flex;flex-direction:column;gap:22px"><div style="font-size:30px;font-weight:700;color:${C.pink};letter-spacing:-0.02em">Beaut.</div><div style="font-size:76px;line-height:1.02;font-weight:600;letter-spacing:-0.035em;color:${fg};text-wrap:balance">${head}</div><div style="font-size:34px;line-height:1.35;color:${dark?C.grey:'#5B5053'};text-wrap:pretty">${sub}</div></div><div style="position:absolute;left:50%;top:700px;transform:translateX(-50%)">${phone(s,1.58)}</div>`,bg)};

const shots=[
['ph1','Book beauty care without an account','No sign-up, no password. Just a booking code.',S.welcome(),true],
['ph2','Hair, nails, skin and lashes','Browse services near you with prices and times up front.',S.home()],
['ph3','Pick your specialist, day and time','See open slots and book the one that suits you.',S.service()],
['ph4','Your code is your booking','Every booking gets a unique code with your name and phone.',S.confirmed()],
['ph5','Find your booking from any phone','Enter your code to see your appointment.',S.find()],
['ph6','Reschedule or cancel in a tap','Change plans without calling the studio.',S.booking()]
];

const tab7=(id,n,head,sub,panes)=>board(id,`7" tablet ${n}`,1200,1920,`<div style="position:absolute;top:130px;left:100px;right:100px;display:flex;flex-direction:column;gap:22px"><div style="font-size:32px;font-weight:700;color:${C.pink}">Beaut.</div><div style="font-size:78px;line-height:1.02;font-weight:600;letter-spacing:-0.035em;text-wrap:balance">${head}</div><div style="font-size:34px;line-height:1.35;color:#5B5053">${sub}</div></div><div style="position:absolute;left:50%;top:760px;transform:translateX(-50%)">${tablet(panes,1.25)}</div>`,n%2?C.soft:C.bg);
const tab10=(id,n,head,sub,panes,dark)=>board(id,`10" tablet ${n}`,2560,1600,`<div style="position:absolute;top:0;bottom:0;left:160px;width:760px;display:flex;flex-direction:column;justify-content:center;gap:28px"><div style="font-size:40px;font-weight:700;color:${C.pink}">Beaut.</div><div style="font-size:104px;line-height:1.02;font-weight:600;letter-spacing:-0.035em;color:${dark?'#fff':C.ink};text-wrap:balance">${head}</div><div style="font-size:40px;line-height:1.35;color:${dark?C.grey:'#5B5053'}">${sub}</div></div><div style="position:absolute;right:140px;top:50%;transform:translateY(-50%)">${tablet(panes,1.5)}</div>`,dark?C.ink:C.soft);

const feature=board('feature','Feature graphic',1024,500,`<div style="position:absolute;left:64px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;gap:20px">${wordmark(84,'#fff',C.pinkL)}<div style="font-size:38px;line-height:1.12;font-weight:500;color:#fff;letter-spacing:-0.02em">Book beauty care with a code. No sign-up.</div></div><div style="position:absolute;right:40px;top:58px;transform:rotate(-8deg)">${phone(S.confirmed(),0.62)}</div><div style="position:absolute;right:250px;top:120px;transform:rotate(6deg);opacity:.95">${phone(S.service(),0.5)}</div>`,C.ink);

const html=[
group('App icon','512×512 PNG, full-bleed square. Google Play applies the rounded mask.',[
 board('icon','Play Store icon',512,512,icon(512),C.pink),
 `<div style="display:flex;flex-direction:column;gap:12px"><div style="font-size:15px;font-weight:600">Masked preview</div><div style="display:flex;gap:28px;align-items:flex-end">${icon(192,48)}${icon(96,96)}${icon(48,12)}</div></div>`
]),
group('Brand logo','Wordmark on light and dark grounds, plus the monogram.',[
